<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commuvent — Where community meets event.</title>
    <meta name="description" content="Commuvent is a free platform for hosting and attending community events. Discover, RSVP, and check in." />
    <meta name="author" content="Commuvent" />

    <meta property="og:title" content="Commuvent — Where community meets event." />
    <meta property="og:description" content="Free community event hosting and attendance." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commuvent" />
    <meta name="twitter:description" content="Where community meets event." />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d = s ? s === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
