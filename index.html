    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d = s ? s === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
